version: "3.9"

services:
  mongodb:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - backend

  redis:
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.12.12-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - backend

  api-service:
    build: ./backend/api-service
    ports:
      - "3000:3000"
    networks:
      - backend
    env_file:
      - .env
    depends_on:
      - mongodb
      - rabbitmq
      - redis  
      
  llm-parser-service:
    build: ./backend/llm-parser-service
    networks:
      - backend
    env_file:
      - .env
    depends_on:
      - rabbitmq

  validation-service:
    build: ./backend/validation-service
    networks:
      - backend
    env_file:
      - .env
    depends_on:
      - rabbitmq
        
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    networks:
      - backend
    depends_on:
      - api-service



volumes:
  mongo-data:
  redis-data:

networks:
  backend:
    driver: bridge
